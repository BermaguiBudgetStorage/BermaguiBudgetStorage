<head>

  <title>Enquiry sent | Bermagui Budget Storage</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="static/favicon-32.png?v=3" />
  <link rel="apple-touch-icon" href="static/apple-touch-icon.png?v=3" />
  <meta name="theme-color" content="#f5f0e8" />
  <script>
    // same no-flash theme pick as the main page
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <style>
    @font-face {
      font-family: 'Cabinet Grotesk';
      src: url('fonts/CabinetGrotesk-Variable.woff2') format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Satoshi';
      src: url('fonts/Satoshi-Variable.woff2') format('woff2');
      font-weight: 300 900;
      font-display: swap;
    }
    :root {
      --bone: #f5f0e8;
      --ink: #1a1a18;
      --pine: #c0510a;
      --pine-soft: #e06620;
      --moss: #5d5c53;
      --line: rgba(26,26,24,0.12);
      --band-text: #f5f0e8;
      --radius: 2px;
      color-scheme: light;
    }
    html[data-theme="dark"] {
      --bone: #141412;
      --ink: #ece7dd;
      --pine: #e06620;
      --pine-soft: #f08040;
      --moss: #9a978c;
      --line: rgba(236,231,221,0.14);
      color-scheme: dark;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Satoshi', system-ui, sans-serif;
      background: var(--bone);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card { max-width: 560px; text-align: center; }
    .eyebrow {
      font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--pine); font-weight: 600;
    }
    h1 {
      font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800;
      font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.05;
      letter-spacing: -0.02em; margin: 0.9rem 0 1.1rem;
    }
    p { color: var(--moss); font-size: 1.05rem; line-height: 1.6; }
    .contact { margin-top: 1.6rem; font-size: 1.05rem; }
    .contact a { color: var(--pine); text-decoration: none; font-weight: 600; }
    .contact a:hover { color: var(--pine-soft); }
    .btn {
      display: inline-block; margin-top: 2.2rem; text-decoration: none;
      font-weight: 600; font-size: 0.98rem; padding: 0.85rem 1.7rem;
      border-radius: var(--radius); border: 1.5px solid var(--line); color: var(--ink);
      transition: border-color 0.2s, color 0.2s, transform 0.15s;
    }
    .btn:hover { border-color: var(--pine); color: var(--pine); transform: translateY(-1px); }
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <main class="card">
    <span class="eyebrow">Enquiry sent</span>
    <h1>Thanks, we've got it.</h1>
    <p>We usually reply the same day. If it's urgent, or you'd rather just talk it through, give us a ring.</p>
    <div class="contact">
      <a href="tel:0458131471">0458 131 471</a>
    </div>
    <a class="btn" href="./">Back to the site</a>
  </main>
  <script src="analytics.js?v=1" defer></script>
</body>
</html>
